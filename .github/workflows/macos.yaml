name: Test macOS Installer
run-name: "Test macOS Installer — ${{ github.event.release.tag_name || github.ref_name }}"

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - 'install.sh'

jobs:
  test-macos:
    runs-on: macos-latest

    env:
      CI: true
      CLAWROUTER_HOSTNAME: "GH-Actions-macOS-CI"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set CI hostname
        run: sudo scutil --set HostName "GH-Actions-macOS-CI"

      - name: Install dependencies
        run: |
          # Node 22 is required. macos-latest usually has Node installed, but let's ensure npm is ready.
          node -v
          npm -v

      - name: Run installer
        run: |
          chmod +x ./install.sh
          # The script reads from /dev/tty or /dev/stdin. In CI, read fails and defaults to 3030.
          ./install.sh

      - name: Verify clawrouter installed
        continue-on-error: true
        run: |
          # Add npm global bin to PATH
          export PATH="$(npm config get prefix)/bin:$PATH"

          if command -v clawrouter >/dev/null 2>&1; then
            echo "[OK] clawrouter found at: $(command -v clawrouter)"
            clawrouter --version
          else
            echo "[ERR] clawrouter NOT found"
            npm list -g --depth=0
            exit 1
          fi

      - name: Check clawrouter service status
        continue-on-error: true
        run: |
          export PATH="$(npm config get prefix)/bin:$PATH"
          clawrouter status

      - name: Check server responding
        continue-on-error: true
        run: |
          # Retry loop — server may take time to start
          for i in 1 2 3 4 5 6; do
            sleep 5
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3030 || echo "failed")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "404" ] || [ "$HTTP_STATUS" = "401" ]; then
              echo "[OK] Server responding! Status: $HTTP_STATUS"
              exit 0
            elif [ "$HTTP_STATUS" = "failed" ]; then
              echo "  Attempt $i/6 - not yet responding..."
            else
              echo "[OK] Server responding with HTTP $HTTP_STATUS"
              exit 0
            fi
          done
          echo "[ERR] Server not responding after 6 attempts"
