name: Test Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'install.ps1'

jobs:
  test-windows:
    runs-on: windows-latest

    env:
      CI: true
      CLAWPROXY_HOSTNAME: "GH-Actions-Win-CI"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Run installer
        shell: pwsh
        run: |
          # Run directly in pwsh (don't launch powershell subprocess)
          & .\install.ps1 -NonInteractive

      - name: Verify clawproxy installed
        continue-on-error: true
        shell: pwsh
        run: |
          # Refresh PATH in this step
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          $cmd = Get-Command clawproxy -ErrorAction SilentlyContinue
          if ($cmd) {
            Write-Host "[OK] clawproxy found at: $($cmd.Source)"
            clawproxy --version
          } else {
            Write-Host "[ERR] clawproxy NOT found"
            npm list -g --depth=0
          }

      - name: Check Windows Service
        continue-on-error: true
        shell: pwsh
        run: |
          # Wait for service to register (node-windows can be slow)
          $maxWait = 30
          $waited = 0
          $svc = $null
          while ($waited -lt $maxWait) {
            $svc = Get-Service -Name "*claw*" -ErrorAction SilentlyContinue
            if ($svc) { break }
            Start-Sleep -Seconds 2
            $waited += 2
            Write-Host "  Waiting for service... ($waited/$maxWait sec)"
          }
          if ($svc) {
            Write-Host "[OK] Service found: $($svc.Name) - Status: $($svc.Status)"
          } else {
            Write-Host "[!!] No clawproxy service found after ${maxWait}s"
          }

      - name: Check server responding
        continue-on-error: true
        shell: pwsh
        run: |
          # Retry loop — server may take time to start
          $maxAttempts = 6
          $attempt = 0
          $success = $false
          while ($attempt -lt $maxAttempts) {
            $attempt++
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3030" -TimeoutSec 5 -UseBasicParsing
              Write-Host "[OK] Server responding! Status: $($r.StatusCode)"
              $success = $true
              break
            } catch {
              Write-Host "  Attempt $attempt/$maxAttempts - not yet responding..."
            }
          }
          if (-not $success) {
            Write-Host "[ERR] Server not responding after $maxAttempts attempts"
          }
