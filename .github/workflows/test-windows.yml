name: Test Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'install.ps1'

jobs:
  test-windows:
    runs-on: windows-latest

    env:
      CI: true
      CLAWPROXY_HOSTNAME: "GH-Actions-Win-CI"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set CI hostname (Machine-level so Windows Service inherits it)
        shell: pwsh
        run: |
          [System.Environment]::SetEnvironmentVariable("CLAWPROXY_HOSTNAME", "GH-Actions-Win-CI", "Machine")
          Write-Host "[OK] CLAWPROXY_HOSTNAME set at Machine level"

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Run installer
        shell: pwsh
        run: |
          # Run directly in pwsh (don't launch powershell subprocess)
          & .\install.ps1 -NonInteractive

      - name: Verify clawproxy installed
        continue-on-error: true
        shell: pwsh
        run: |
          # Refresh PATH in this step
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          $cmd = Get-Command clawproxy -ErrorAction SilentlyContinue
          if ($cmd) {
            Write-Host "[OK] clawproxy found at: $($cmd.Source)"
            clawproxy --version
          } else {
            Write-Host "[ERR] clawproxy NOT found"
            npm list -g --depth=0
          }

      - name: Check and start Windows Service
        continue-on-error: true
        shell: pwsh
        run: |
          # Wait for service to register (node-windows can be slow)
          $maxWait = 30
          $waited = 0
          $svc = $null
          while ($waited -lt $maxWait) {
            $svc = Get-Service -Name "*claw*" -ErrorAction SilentlyContinue
            if ($svc) { break }
            Start-Sleep -Seconds 2
            $waited += 2
            Write-Host "  Waiting for service... ($waited/$maxWait sec)"
          }
          if ($svc) {
            Write-Host "[OK] Service found: $($svc.Name) - Status: $($svc.Status)"
            # If service registered but not running, try to start it
            if ($svc.Status -ne 'Running') {
              Write-Host "  Attempting to start service..."
              try {
                Start-Service -Name $svc.Name
                Start-Sleep -Seconds 3
                $svc = Get-Service -Name $svc.Name
                Write-Host "[OK] Service status: $($svc.Status)"
              } catch {
                Write-Host "[!!] Could not start service: $_"
                Write-Host "  Falling back to direct process start..."
                $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
                $globalPrefix = (npm config get prefix).Trim()
                $entryPoint = Join-Path $globalPrefix "node_modules\clawproxy\backend\dist\index.js"
                if (Test-Path $entryPoint) {
                  Start-Process -FilePath "node" -ArgumentList $entryPoint -WindowStyle Hidden -PassThru
                  Write-Host "[OK] Started ClawProxy directly as process"
                  Start-Sleep -Seconds 5
                } else {
                  Write-Host "[ERR] Entry point not found: $entryPoint"
                }
              }
            }
          } else {
            Write-Host "[!!] No clawproxy service found after ${maxWait}s"
            Write-Host "  Falling back to direct process start..."
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
            $globalPrefix = (npm config get prefix).Trim()
            $entryPoint = Join-Path $globalPrefix "node_modules\clawproxy\backend\dist\index.js"
            if (Test-Path $entryPoint) {
              Start-Process -FilePath "node" -ArgumentList $entryPoint -WindowStyle Hidden -PassThru
              Write-Host "[OK] Started ClawProxy directly as process"
              Start-Sleep -Seconds 5
            } else {
              Write-Host "[ERR] Entry point not found: $entryPoint"
            }
          }

      - name: Check server responding
        continue-on-error: true
        shell: pwsh
        run: |
          # Retry loop — server may take time to start
          $maxAttempts = 6
          $attempt = 0
          $success = $false
          while ($attempt -lt $maxAttempts) {
            $attempt++
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3030" -TimeoutSec 5 -UseBasicParsing
              Write-Host "[OK] Server responding! Status: $($r.StatusCode)"
              $success = $true
              break
            } catch {
              Write-Host "  Attempt $attempt/$maxAttempts - not yet responding..."
            }
          }
          if (-not $success) {
            Write-Host "[ERR] Server not responding after $maxAttempts attempts"
          }
