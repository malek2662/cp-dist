name: Test Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'install.ps1'

jobs:
  test-windows:
    runs-on: windows-latest

    env:
      CI: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set CI hostname
        shell: pwsh
        run: Rename-Computer -NewName "GH-Actions-Win-CI" -Force

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Run installer
        shell: pwsh
        run: |
          # Run directly in pwsh (don't launch powershell subprocess)
          & .\install.ps1 -NonInteractive

      - name: Verify clawproxy installed
        shell: pwsh
        continue-on-error: true
        run: |
          # Refresh PATH in this step
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          $cmd = Get-Command clawproxy -ErrorAction SilentlyContinue
          if ($cmd) {
            Write-Host "[OK] clawproxy found at: $($cmd.Source)"
            clawproxy --version
          } else {
            Write-Host "[ERR] clawproxy NOT found"
            npm list -g --depth=0
          }

      - name: Check Windows Service
        shell: pwsh
        continue-on-error: true
        run: |
          $svc = Get-Service -Name "*claw*" -ErrorAction SilentlyContinue
          if ($svc) {
            Write-Host "[OK] Service found: $($svc.Name) - Status: $($svc.Status)"
          } else {
            Write-Host "[!!] No clawproxy service found"
          }

      - name: Check server responding
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Sleep -Seconds 5
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:3030" -TimeoutSec 5 -UseBasicParsing
            Write-Host "[OK] Server responding! Status: $($r.StatusCode)"
          } catch {
            Write-Host "[ERR] Server not responding: $_"
          }
